name: CI

on:
  push:
    branches: [main, dnet-ui-refine]
  pull_request:
    branches: [main, dnet-ui-refine]

jobs:
  lint-typecheck-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: TypeScript type check (libs)
        run: pnpm run typecheck:libs

      - name: TypeScript type check (app)
        run: pnpm --filter @workspace/dnet-market run typecheck

      - name: ESLint
        run: pnpm --filter @workspace/dnet-market run lint
        continue-on-error: true

      - name: Build app
        run: pnpm --filter @workspace/dnet-market run build
        env:
          PORT: '3000'
          BASE_PATH: '/'
